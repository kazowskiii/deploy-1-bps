<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMONEV BPS — Sistem Monitoring &amp; Evaluasi Kinerja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2EE;
  --surface:#FFFFFF;
  --surface-2:#F7F8F5;
  --ink:#16232E;
  --ink-muted:#5B6B78;
  --ink-faint:#8B98A3;
  --primary:#163B5C;
  --primary-dark:#0E2A44;
  --primary-soft:#E7EDF2;
  --accent:#B4872A;
  --accent-soft:#F1E6C9;
  --success:#2E7D57;
  --success-soft:#E4F1EA;
  --warning:#C9820B;
  --warning-soft:#FBF0DB;
  --danger:#B23A34;
  --danger-soft:#F8E7E5;
  --line:#DFE3E0;
  --line-strong:#C7CDC9;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,30,45,.05), 0 4px 14px rgba(15,30,45,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--accent-soft);}

/* ===== Layout ===== */
#app{display:flex;height:100vh;overflow:hidden;}
.sidebar{
  width:236px;flex:none;
  background:linear-gradient(185deg,var(--primary-dark),var(--primary) 78%);
  color:#EAF0F4;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.brand-mark{
  display:flex;align-items:center;gap:10px;
}
.brand-seal{
  width:38px;height:38px;border-radius:50%;
  border:1.5px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:13px;
  color:var(--accent);flex:none;
  position:relative;
}
.brand-seal::after{
  content:'';position:absolute;inset:4px;border:1px solid rgba(180,135,42,.5);border-radius:50%;
}
.brand-text .t1{font-family:'Fraunces',serif;font-weight:600;font-size:16.5px;letter-spacing:.2px;line-height:1.1;}
.brand-text .t2{font-size:10.5px;color:#B9CADA;letter-spacing:.6px;text-transform:uppercase;margin-top:3px;}
.nav{flex:1;padding:14px 12px;overflow-y:auto;overscroll-behavior:contain;}
.nav-group-label{
  font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  color:#8FA6B8;padding:14px 10px 6px;font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;border-radius:8px;
  color:#D8E3EB;text-decoration:none;font-size:13.5px;font-weight:500;
  margin-bottom:2px;transition:background .12s;
  border:1px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.07);}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff;border-color:rgba(255,255,255,.1);}
.nav-item .ic{width:17px;height:17px;flex:none;opacity:.9;}
.nav-item .badge-count{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  background:rgba(255,255,255,.12);padding:1px 6px;border-radius:20px;color:#CFE0EA;
}
.sidebar-foot{
  padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.12);
  font-size:11px;color:#8FA6B8;line-height:1.5;
}

.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:16px 28px;display:flex;align-items:center;justify-content:space-between;
  flex:none;z-index:20;gap:16px;flex-wrap:wrap;
}
.topbar-title h1{margin:0;font-size:21px;font-weight:600;color:var(--primary-dark);}
.topbar-title p{margin:2px 0 0;font-size:12.5px;color:var(--ink-muted);}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.select-mini{
  border:1px solid var(--line-strong);background:var(--surface-2);
  border-radius:7px;padding:7px 10px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink);
}
.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:24px 28px 60px;}
.content > *{max-width:1320px;width:100%;margin:0 auto;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:8px;border:1px solid transparent;
  font-size:13px;font-weight:600;line-height:1;transition:all .12s;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-gold{background:var(--accent);color:#fff;}
.btn-gold:hover{background:#9c7423;}
.btn-outline{background:var(--surface);border-color:var(--line-strong);color:var(--ink);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-ghost{background:transparent;color:var(--ink-muted);border-color:transparent;padding:7px 10px;}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
.btn-danger-ghost{background:transparent;color:var(--danger);border-color:transparent;padding:7px 10px;}
.btn-danger-ghost:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ===== Cards / KPI ===== */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

.kpi-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.kpi-card .eyebrow{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}
.kpi-card .value{font-family:'Fraunces',serif;font-size:32px;font-weight:600;margin:6px 0 2px;color:var(--primary-dark);}
.kpi-card .sub{font-size:12px;color:var(--ink-muted);}
.kpi-card .trend{position:absolute;top:16px;right:16px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;}
.trend.up{background:var(--success-soft);color:var(--success);}
.trend.warn{background:var(--warning-soft);color:var(--warning);}
.trend.down{background:var(--danger-soft);color:var(--danger);}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.panel-head{
  padding:16px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.panel-head h3{margin:0;font-size:16px;font-weight:600;color:var(--primary-dark);}
.panel-head p{margin:2px 0 0;font-size:12px;color:var(--ink-muted);}
.panel-body{padding:18px 20px;}

/* ===== Tables ===== */
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink-faint);font-weight:600;padding:9px 12px;border-bottom:1.5px solid var(--line-strong);
  white-space:nowrap;
}
tbody td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}
.cell-title{font-weight:600;color:var(--ink);}
.cell-sub{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
.table-wrap{overflow-x:auto;}

/* ===== Badges / status ===== */
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;
}
.tag-success{background:var(--success-soft);color:var(--success);}
.tag-warning{background:var(--warning-soft);color:var(--warning);}
.tag-danger{background:var(--danger-soft);color:var(--danger);}
.tag-muted{background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--line);}
.tag-primary{background:var(--primary-soft);color:var(--primary);}
.tag-gold{background:var(--accent-soft);color:#8A6720;}

/* progress bar */
.pbar{height:7px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;}
.pbar > div{height:100%;border-radius:20px;background:var(--primary);}
.pbar.success>div{background:var(--success);}
.pbar.warning>div{background:var(--warning);}
.pbar.danger>div{background:var(--danger);}

/* team pill */
.team-pill{
  display:inline-block;padding:2px 9px;border-radius:6px;background:var(--primary-soft);
  color:var(--primary);font-size:11.5px;font-weight:600;
}

/* ===== Stamp / seal signature element (triwulan status) ===== */
.stamp{
  width:56px;height:56px;border-radius:50%;flex:none;position:relative;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--line-strong);color:var(--ink-faint);
  transform:rotate(-6deg);
}
.stamp.filled{border-color:var(--success);color:var(--success);}
.stamp.late{border-color:var(--warning);color:var(--warning);}
.stamp.empty{border-style:dashed;}
.stamp::before{
  content:'';position:absolute;inset:5px;border:1px solid currentColor;border-radius:50%;opacity:.55;
}
.stamp .stamp-q{font-family:'Fraunces',serif;font-weight:700;font-size:15px;line-height:1;}
.stamp .stamp-pct{font-family:'IBM Plex Mono',monospace;font-size:8.5px;margin-top:1px;}

/* ===== Quarter grid (Tugas Tim) ===== */
.q-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
@media(max-width:900px){.q-grid{grid-template-columns:repeat(2,1fr);}}
.q-card{
  border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface-2);
  display:flex;flex-direction:column;gap:8px;
}
.q-card-head{display:flex;align-items:center;justify-content:space-between;}
.q-card-head .q-label{font-size:11.5px;font-weight:700;color:var(--primary-dark);letter-spacing:.3px;}
.q-input{
  width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;
  font-size:12.5px;font-family:'IBM Plex Mono',monospace;background:#fff;
}
.q-evidence-row{display:flex;align-items:center;gap:6px;font-size:11px;}
.q-select-row{display:flex;align-items:center;gap:10px;margin:10px 0 4px;}
.q-select-row label{font-size:12px;font-weight:600;color:var(--ink-muted);}
.q-select{
  border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;
  font-size:13px;font-weight:600;background:#fff;color:var(--primary-dark);cursor:pointer;
}
.q-grid-single{grid-template-columns:minmax(0,340px);}
.evidence-chip{
  display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line-strong);
  border-radius:6px;padding:4px 8px;font-size:11px;color:var(--ink-muted);max-width:100%;overflow:hidden;
}
.evidence-chip svg{flex:none;}
.evidence-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-input-hidden{display:none;}

.evidence-view-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:8px;
  border:1.5px solid var(--success);background:#fff;color:var(--success);
  cursor:pointer;transition:background .12s,transform .1s;
}
.evidence-view-btn:hover{background:var(--success-soft);}
.evidence-view-btn:active{transform:scale(.94);}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(14,24,34,.5);backdrop-filter:blur(1.5px);
  display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;
  z-index:100;overflow-y:auto;
}
.modal{
  background:var(--surface);border-radius:14px;width:100%;max-width:640px;
  box-shadow:0 20px 60px rgba(10,20,30,.3);border:1px solid var(--line);
  animation:modalIn .16s ease-out;
}
@keyframes modalIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.modal-head{
  padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{margin:0;font-size:17px;font-weight:600;color:var(--primary-dark);}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:5px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;font-size:13px;
  font-family:'Inter',sans-serif;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.page-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;}
.page-filters .field{margin-bottom:0;min-width:200px;flex:1;}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-bottom:10px;}
.page-actions-bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:center;}
.close-x{
  border:none;background:transparent;color:var(--ink-muted);font-size:20px;line-height:1;padding:4px;border-radius:6px;
}
.close-x:hover{background:var(--surface-2);}

/* upload dropzone */
.dropzone{
  border:1.5px dashed var(--line-strong);border-radius:9px;padding:16px;text-align:center;
  background:var(--surface-2);cursor:pointer;transition:border-color .12s;
}
.dropzone:hover{border-color:var(--primary);}
.dropzone .dz-title{font-size:12.5px;font-weight:600;color:var(--ink);}
.dropzone .dz-sub{font-size:11px;color:var(--ink-muted);margin-top:2px;}

/* empty state */
.empty-state{padding:44px 20px;text-align:center;color:var(--ink-muted);}
.empty-state .es-ic{width:38px;height:38px;color:var(--ink-faint);margin:0 auto 10px;}
.empty-state .es-title{font-weight:600;color:var(--ink);font-size:14px;margin-bottom:3px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--primary-dark);color:#fff;padding:11px 16px;border-radius:8px;font-size:12.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;min-width:220px;
  animation:toastIn .18s ease-out;
}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.tabs-mini{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);padding:3px;border-radius:9px;}
.tab-mini-btn{
  border:none;background:transparent;padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-muted);
}
.tab-mini-btn.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08);}

.icon-btn{border:1px solid var(--line-strong);background:#fff;border-radius:7px;padding:6px 9px;color:var(--ink-muted);}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);}

.section-note{
  display:flex;gap:9px;align-items:flex-start;background:var(--primary-soft);border:1px solid #CBD9E4;
  padding:11px 13px;border-radius:9px;font-size:12px;color:var(--primary-dark);margin-bottom:16px;
}
.section-note svg{flex:none;margin-top:1px;}

.loading-screen{
  position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:999;
}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--primary);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== Login (split-screen, tema BPS teal) ===== */
.login-shell{
  --lg-teal-1:#0f2f36; --lg-teal-2:#12464a; --lg-teal-accent:#1f8f7d;
  display:flex;height:100%;width:100%;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);
}
.login-visual{
  flex:1 1 56%;min-width:0;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--lg-teal-1),var(--lg-teal-2) 80%);
  color:#EAF4F1;padding:56px 60px;display:flex;flex-direction:column;justify-content:center;
}
.login-visual::after{
  content:'';position:absolute;right:-140px;bottom:-160px;width:420px;height:420px;border-radius:50%;
  border:1px solid rgba(255,255,255,.10);
}
.login-visual::before{
  content:'';position:absolute;right:-40px;bottom:-260px;width:560px;height:560px;border-radius:50%;
  border:1px solid rgba(255,255,255,.07);
}
.login-eyebrow{
  font-size:12.5px;letter-spacing:.14em;font-weight:700;text-transform:uppercase;color:#8fd8c8;margin-bottom:22px;
}
.login-visual h1{
  font-family:'Fraunces',serif;font-weight:700;font-size:44px;line-height:1.12;margin:0 0 18px;max-width:560px;color:#fff;
}
.login-visual .lede{font-size:15.5px;line-height:1.6;color:#CFE6E0;max-width:480px;margin:0 0 34px;}
.login-shield{
  position:relative;z-index:1;display:flex;gap:12px;align-items:flex-start;max-width:480px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px 16px;
}
.login-shield svg{flex:none;margin-top:2px;color:#9fe0d1;}
.login-shield span{font-size:13px;line-height:1.55;color:#DCEFEA;}
.login-panel{
  flex:1 1 44%;min-width:340px;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--surface);
}
.login-card{width:100%;max-width:420px;}
.login-brandrow{display:flex;align-items:center;gap:12px;margin-bottom:30px;}
.login-brandmark{
  width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,var(--lg-teal-2),var(--lg-teal-1));
  display:flex;align-items:center;justify-content:center;color:#fff;flex:none;
}
.login-brandrow .lb-name{font-family:'Fraunces',serif;font-weight:700;font-size:19px;color:var(--primary-dark);line-height:1.2;}
.login-brandrow .lb-org{font-size:12px;color:var(--ink-muted);}
.login-card .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lg-teal-2, #1f8f7d);margin-bottom:8px;}
.login-card h2{margin:0 0 8px;font-size:26px;font-family:'Fraunces',serif;color:var(--primary-dark);}
.login-card p{margin:0 0 22px;color:var(--ink-muted);line-height:1.55;font-size:13.5px;}
.login-card .field{margin-bottom:16px;}
.login-card .field label{display:block;margin-bottom:6px;font-size:12.5px;font-weight:600;color:var(--ink);}
.login-card .field input{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);}
.login-card .field input:focus{outline:none;border-color:#1f8f7d;box-shadow:0 0 0 3px rgba(31,143,125,.15);}
.login-card .btn-login{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(160deg,var(--lg-teal-2),var(--lg-teal-1));border:none;color:#fff;
  border-radius:10px;padding:13px 16px;font-size:14.5px;font-weight:600;cursor:pointer;
}
.login-card .btn-login:hover{filter:brightness(1.08);}
.login-card .login-note{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:16px;}
@media (max-width:860px){
  .login-shell{flex-direction:column;}
  .login-visual{padding:40px 28px;}
  .login-visual h1{font-size:32px;}
}

/* ===== Notification bell ===== */
.bell-wrap{position:relative;}
.bell-btn{
  position:relative;border:1px solid var(--line-strong);background:var(--surface-2);
  border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);
}
.bell-btn .dot{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;

async function initAuth(){
  try {
    const res = await fetch('/api/me', { credentials: 'include' });
    if (!res.ok) throw new Error('Belum login');
    AUTH.user = await res.json();
    AUTH.loggedIn = true;
  } catch (err) {
    AUTH.loggedIn = false;
    AUTH.user = null;
  }
}
function setAuth(user){
  AUTH.loggedIn = !!user;
  AUTH.user = user || null;
}
async function requireAuthOrLogin(){
  const path = window.location.pathname.replace(/\/+$/, '') || '/';
  if(AUTH.loggedIn){
    if(path === '/login' || path === '/register') history.replaceState(null, '', '/');
    renderShell();
    return;
  }
  try{
    const res = await fetch('/api/setup-status');
    const data = await res.json();
    NEEDS_SETUP = !!data.needsSetup;
  }catch(e){
    NEEDS_SETUP = false;
  }
  if(NEEDS_SETUP){
    renderSetupPage();
    return;
  }
  if(path === '/register'){
    await showRegisterView();
  } else {
    if(path !== '/login') history.replaceState(null, '', '/login');
    renderLoginPage();
  }
}
function showLoginView(){
  AUTH_VIEW = 'login';

  const triwulanOptions = [

    {value:'1',label:'Triwulan I'},

  let firstFields;

    firstFields = triwulanField;

  }
  return `<div class="page-filters">

function updatePageFilter(key, value){
  PAGE_FILTERS[key] = value;
  const activeId = document.activeElement ? document.activeElement.id : null;
  const cursorPos = (activeId && document.activeElement.selectionStart !== undefined)
    ? document.activeElement.selectionStart : null;
  renderContent();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(cursorPos !== null && el.setSelectionRange){
        el.setSelectionRange(cursorPos, cursorPos);
      }
    }
  }
}
function buildSearchRegex(rawNeedle){
  const escaped = rawNeedle.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if(!escaped) return null;
  return new RegExp(escaped, 'i'); // substring match: cocok di mana saja dalam teks, tidak harus kata utuh
}
const ROMAN_TO_ARABIC = { i: 1, ii: 2, iii: 3, iv: 4 };
function periodeToArabic(periode){
  if(!periode) return null;
  const m = /triwulan\s+(iv|iii|ii|i)\b/i.exec(periode);
  if(!m) return null;
  return ROMAN_TO_ARABIC[m[1].toLowerCase()] || null;
}
// Field per koleksi yang boleh diikutkan dalam pencarian bebas. Sengaja TIDAK
// menyertakan field angka murni (target, capaian, persentase, realisasi, dst)
// supaya mencari "11" tidak ikut menangkap data lain yang kebetulan bernilai 11.
const SEARCHABLE_FIELDS = {
  fra: ['periode', 'namaKegiatan', 'catatan'],
  kegiatan: ['nama', 'kendala', 'solusi', 'rtl', 'status'],
  tugas: ['nama', 'satuan'],
  iku: ['kode', 'nama', 'satuan'],
  tim: ['name'],
};
function buildSearchableText(item, collection){
  const fields = SEARCHABLE_FIELDS[collection] || [];
  let text = fields.map(f=>item[f]!=null ? String(item[f]) : '').join(' ');
  text += ' ' + teamName(item.timId || item.id);
  if(collection === 'fra'){
    const arabic = periodeToArabic(item.periode);
    if(arabic) text += ` triwulan ${arabic}`;
    if(item.ikuNomor) text += ` iku ${item.ikuNomor}`;
  }
  if(collection === 'iku' && item.kode){
    text += ` kode ${item.kode}`;
  }
  if(collection === 'tugas' && item.tahun){
    text += ` tahun ${item.tahun}`;
  }
  return text.toLowerCase();
}
function applyPageFilters(items, collection){
  let result = Array.isArray(items) ? [...items] : [];
  if(PAGE_FILTERS.teamId){
    result = result.filter(item=>item.timId===PAGE_FILTERS.teamId || item.id===PAGE_FILTERS.teamId);
  }
  if(PAGE_FILTERS.status){
    result = result.filter(item=>statusLabelFor(collection, item).toLowerCase()===PAGE_FILTERS.status.toLowerCase());
  }
  if((collection === 'fra' || collection === 'kegiatan') && PAGE_FILTERS.triwulan){
    result = result.filter(item=>String(periodeToArabic(item.periode))===PAGE_FILTERS.triwulan);
  }
  if(collection !== 'fra' && PAGE_FILTERS.search){
    const regex = buildSearchRegex(PAGE_FILTERS.search);
    if(regex){
      result = result.filter(item=>regex.test(buildSearchableText(item, collection)));
    }
  }
  return result;
}
function statusLabelFor(collection, item){
  if(collection==='iku' || collection==='tugas') return statusFor(collection==='iku'?ikuPct(item):tugasPct(item)).label;
  if(collection==='kegiatan') return item.status || '—';
  if(collection==='fra') return fraStatusFor(Number(item.persentase)||0).label;
  return '—';
}

    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      credentials: 'include',
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || 'Gagal masuk');
    }
    setAuth(data);
    toast('Berhasil masuk sebagai ' + data.username, 'ok');
    history.replaceState(null, '', '/');
    await loadAll();
    renderShell();
    initSSE();
  } catch (err) {
    toast(err.message === 'Failed to fetch' ? 'Tidak dapat terhubung ke server. Pastikan server sedang berjalan.' : err.message, 'err');
  }
}

/* ---------------- API helpers (backend Express + penyimpanan file di server) ---------------- */
async function apiGet(col){
  const r = await fetch(`/api/${col}`, { credentials: 'include' });
  if(!r.ok) throw new Error('Gagal memuat data ' + col);
  return r.json();
}
async function parseApiError(r, fallback){
  let data = {};
  try{ data = await r.json(); }catch(e){ /* respons bukan JSON, abaikan */ }
  if(Array.isArray(data.details) && data.details.length){
    return data.details.join('; ');
  }
  return data.error || fallback;
}
async function apiPost(col, body){
  const r = await fetch(`/api/${col}`, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify(body) });
  if(!r.ok) throw new Error(await parseApiError(r, 'Gagal menyimpan data'));
  return r.json();
}
async function apiPut(col, id, body){
  const r = await fetch(`/api/${col}/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify(body) });
  if(!r.ok) throw new Error(await parseApiError(r, 'Gagal memperbarui data'));
  return r.json();
}
async function apiDelete(col, id){
  const r = await fetch(`/api/${col}/${id}`, { method:'DELETE', credentials:'include' });
  if(!r.ok) throw new Error(await parseApiError(r, 'Gagal menghapus data'));
  return r.json();
}
async function apiDeleteFile(itemId){
  if(!itemId) return;
  try{
    await fetch(`/api/files/${itemId}`, { method:'DELETE', credentials:'include' });
  }catch(e){
    console.error('Gagal menghapus berkas lama/salah pilih di OneDrive:', e.message || e);
  }
}
async function uploadFileToServer(file, kind, extra){
  const fd = new FormData();
  fd.append('file', file);
  if(kind) fd.append('kind', kind);
  if(extra){
    Object.keys(extra).forEach(k=>{
      if(extra[k]!==undefined && extra[k]!==null) fd.append(k, extra[k]);
    });
  }
  const r = await fetch('/api/upload', { method:'POST', credentials:'include', body:fd });
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Gagal mengunggah berkas');
  return data; // {filename, originalName, size, mimetype}
}

/* ---------------- Realtime updates (Server-Sent Events) ---------------- */
let sseSource = null;
let sseRefreshTimer = null;

function initSSE(){
  stopSSE();
  try{
    sseSource = new EventSource('/api/events');
    sseSource.onmessage = () => { scheduleSseRefresh(); };
    sseSource.onerror = () => { /* browser akan mencoba reconnect otomatis */ };
  }catch(e){
    console.error('Gagal membuka koneksi realtime:', e.message);
  }
}
function stopSSE(){
  if(sseSource){ sseSource.close(); sseSource = null; }
  if(sseRefreshTimer){ clearTimeout(sseRefreshTimer); sseRefreshTimer = null; }
}
function scheduleSseRefresh(){
  if(sseRefreshTimer) clearTimeout(sseRefreshTimer);
  sseRefreshTimer = setTimeout(async ()=>{
    await loadAll();
    safeRerender();
  }, 400);
}
function countByYear(collection){
  // FRA & Kegiatan: item lama tanpa field tahun tetap ikut dihitung (anggap "semua tahun").
  // Kelola Target IKU: field tahun selalu ada, jadi filter ketat sesuai FILTER_YEAR.
  if(collection === 'ikuTargets'){
    return (DB.ikuTargets||[]).filter(t=>Number(t.tahun)===FILTER_YEAR).length;
  }
  return (DB[collection]||[]).filter(item=>!item.tahun || Number(item.tahun)===FILTER_YEAR).length;
}

function safeRerender(){
  const contentEl = document.getElementById('content');
  const active = document.activeElement;
  const isContentInput = contentEl && active && contentEl.contains(active) && active.id;
  const activeId = isContentInput ? active.id : null;
  const cursorPos = (activeId && active.selectionStart !== undefined) ? active.selectionStart : null;

  if(document.getElementById('topbar')) renderTopbar();
  updateSidebarBadges();
  if(contentEl) renderContent();

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(cursorPos !== null && el.setSelectionRange) el.setSelectionRange(cursorPos, cursorPos);
    }
  }
}

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err'?' err':type==='ok'?' ok':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  if(!d) return '—';
  // Kalau string sudah mengandung waktu (ISO lengkap), jangan tambahkan 'T00:00:00' lagi.
  const dt = /T/.test(d) ? new Date(d) : new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtTime(iso){
  if(!iso) return '';
  const dt = new Date(iso);
  if(isNaN(dt)) return '';
  return dt.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) + ' WIB';
}
function fmtBytes(n){
  if(!n) return '';
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}
function teamName(id){ const t = DB.teams.find(t=>t.id===id); return t ? t.name : '—'; }
function findIkuTarget(ikuNomor, tahun){
  return (DB.ikuTargets||[]).find(t=>t.ikuNomor===ikuNomor && Number(t.tahun)===Number(tahun));
}
function yearsAvailable(){
  const ys = new Set([FILTER_YEAR]);
  const thisYear = new Date().getFullYear();
  ys.add(thisYear);
  ys.add(thisYear + 1);
  DB.iku.forEach(i=>ys.add(Number(i.tahun)));
  DB.tugas.forEach(i=>ys.add(Number(i.tahun)));
  DB.fra.forEach(f=>{ if(f.tahun) ys.add(Number(f.tahun)); });
  DB.kegiatan.forEach(k=>{ if(k.tahun) ys.add(Number(k.tahun)); });
  return Array.from(ys).filter(y=>!isNaN(y)).sort((a,b)=>b-a);
}

/* ---------------- evidence handling (berkas fisik tersimpan di server, folder /uploads) ---------------- */
function validFileType(file){
  const okExt = ['.pdf','.doc','.docx','.jpg','.jpeg','.png','.gif','.webp','.bmp','.svg','.tif','.tiff','.heic','.heif'];
  const name = file.name.toLowerCase();
  return okExt.some(ext=>name.endsWith(ext));
}
function validateFileOrToast(file){
  if(!validFileType(file)){
    toast('Format harus PDF, Word, atau Gambar (.pdf, .doc, .docx, .jpg, .png, dll)', 'err');
    return false;
  }
  if(file.size > MAX_FILE_MB*1024*1024){
    toast(`Ukuran berkas maksimal ${MAX_FILE_MB} MB`, 'err');
    return false;
  }
  return true;
}
let CURRENT_EVIDENCE_VIEW = null; // {groupId, index, total} — dipakai navigasi tombol panah keyboard
async function viewEvidenceGroup(groupId, index){
  const files = EVIDENCE_GROUPS[groupId] || [];
  if(!files.length) return;
  const i = Math.max(0, Math.min(index, files.length-1));
  const file = files[i];
  const serverFilename = file.fileName || file.filename;
  CURRENT_EVIDENCE_VIEW = { groupId, index: i, total: files.length };
  openFileViewerModal(); // tampilkan modal dengan status loading dulu
  try{
    const r = await fetch(`/api/files/${serverFilename}/info`, { credentials:'include' });
    const info = await r.json().catch(()=>({}));
    if(!r.ok || !info.downloadUrl) throw new Error(info.error || 'Berkas tidak ditemukan');
    renderFileViewer(info, serverFilename, groupId, i, files.length);
  }catch(e){
    renderFileViewerError(e.message || 'Gagal memuat berkas', serverFilename, groupId, i, files.length);
  }
}
function openFileViewerModal(){
  const old = document.getElementById('fileViewerOverlay');
  if(old) old.remove();
  const html = `<div class="modal-overlay" id="fileViewerOverlay">
    <div class="modal" style="max-width:900px;width:95%;">
      <div class="modal-head"><h3 id="fileViewerTitle">Memuat berkas…</h3><button class="close-x" onclick="closeFileViewerModal()">${ICONS.x}</button></div>
      <div class="modal-body" style="padding:0;max-height:80vh;">
        <div id="fileViewerBody" style="min-height:420px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:13px;">
          <div class="spinner" style="width:26px;height:26px;"></div>
        </div>
      </div>
      <div class="modal-foot" id="fileViewerFoot" style="justify-content:space-between;"></div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const overlay = document.getElementById('fileViewerOverlay');
  overlay.addEventListener('click', e=>{ if(e.target.id==='fileViewerOverlay') closeFileViewerModal(); });
}
function closeFileViewerModal(){
  const old = document.getElementById('fileViewerOverlay');
  if(old) old.remove();
  CURRENT_EVIDENCE_VIEW = null;
}
function renderFileViewer(info, serverFilename, groupId, index, total){
  const titleEl = document.getElementById('fileViewerTitle');
  const bodyEl = document.getElementById('fileViewerBody');
  const footEl = document.getElementById('fileViewerFoot');
  if(!titleEl || !bodyEl) return;
  const hasMultiple = total > 1;
  titleEl.textContent = (info.name || 'Pratinjau Berkas') + (hasMultiple ? ` (${index+1}/${total})` : '');
  const viewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(info.downloadUrl)}&embedded=true`;
  bodyEl.innerHTML = `<iframe src="${viewerUrl}" style="width:100%;height:75vh;border:none;display:block;" title="Pratinjau berkas"></iframe>`;
  footEl.innerHTML = `
    <div class="flex gap-6">
      ${hasMultiple ? `
        <button class="btn btn-outline btn-sm" ${index<=0?'disabled':''} onclick="viewEvidenceGroup('${groupId}',${index-1})">‹ Sebelumnya</button>
        <button class="btn btn-outline btn-sm" ${index>=total-1?'disabled':''} onclick="viewEvidenceGroup('${groupId}',${index+1})">Berikutnya ›</button>
      ` : ''}
    </div>
    <div class="flex gap-6">
      <button class="btn btn-outline" onclick="window.open('/api/files/${serverFilename}','_blank')">Buka di Tab Baru</button>
      <button class="btn btn-primary" onclick="closeFileViewerModal()">Tutup</button>
    </div>
  `;
}
function renderFileViewerError(message, serverFilename, groupId, index, total){
  const titleEl = document.getElementById('fileViewerTitle');
  const bodyEl = document.getElementById('fileViewerBody');
  const footEl = document.getElementById('fileViewerFoot');
  if(!titleEl || !bodyEl) return;
  const hasMultiple = total > 1;
  titleEl.textContent = 'Gagal memuat berkas' + (hasMultiple ? ` (${index+1}/${total})` : '');
  bodyEl.innerHTML = `<div style="padding:30px;text-align:center;color:var(--danger);font-size:13px;">${escapeHtml(message)}</div>`;
  footEl.innerHTML = `
    <div class="flex gap-6">
      ${hasMultiple ? `
        <button class="btn btn-outline btn-sm" ${index<=0?'disabled':''} onclick="viewEvidenceGroup('${groupId}',${index-1})">‹ Sebelumnya</button>
        <button class="btn btn-outline btn-sm" ${index>=total-1?'disabled':''} onclick="viewEvidenceGroup('${groupId}',${index+1})">Berikutnya ›</button>

    </div>
    <div class="flex gap-6">
      <button class="btn btn-outline" onclick="window.open('/api/files/${serverFilename}','_blank')">Coba Buka di Tab Baru</button>
      <button class="btn btn-primary" onclick="closeFileViewerModal()">Tutup</button>
    </div>
  `;
}

async function openNotificationTarget(id){

function truncate(s,n){ s=s||''; return s.length>n? s.slice(0,n)+'…' : s; }
function formatNumber(n){ return n==null ? '0' : Number(n).toLocaleString('id-ID'); }
function wireChartTeamFilter(){
  const el = document.getElementById('chartTeamFilter');
  if(el) el.addEventListener('change', e=>{
    CHART_TEAM_FILTER = e.target.value;
    renderTeamProgressChart();
  });
}
function renderTeamProgressChart(){
  const canvas = document.getElementById('teamProgressChart');
  if(!canvas) return;
  const emptyEl = document.getElementById('teamProgressEmpty');
  const legend = document.getElementById('teamProgressLegend');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  ctx.clearRect(0,0,width,height);

  const quarters = ['q1','q2','q3','q4'];
  const labels = quarters.map(q=>TRIWULAN_LABELS[q]);
  const visibleTeams = CHART_TEAM_FILTER ? DB.teams.filter(tm=>tm.id===CHART_TEAM_FILTER) : DB.teams;
  const teamsData = visibleTeams.map(team=>{
    const teamFra = DB.fra.filter(f=>(Number(f.tahun)===FILTER_YEAR || !f.tahun) && f.timId===team.id);
    if(!teamFra.length) return null;
    // Titik hanya dihitung untuk triwulan yang SUDAH punya entri FRA.
    // Triwulan yang belum diisi sama sekali diberi nilai null, supaya garis
    // berhenti di titik data terakhir yang nyata (bukan cumulative — nilainya
    // rata-rata persentase capaian FRA pada triwulan tersebut).
    const points = quarters.map((q,i)=>{
      const qNum = i+1; // 1..4, cocok dengan Triwulan I..IV
      const qentries = teamFra.filter(f=>periodeToArabic(f.periode)===qNum);
      if(!qentries.length) return null;
      const avg = Math.round(qentries.reduce((sum,f)=> sum + (Number(f.persentase)||0), 0)/qentries.length);
      return Math.min(100, avg);
    });
    return { name: team.name, points };
  }).filter(x=>x && x.points.some(v=>v!==null && v>0));

  // ===== Tidak ada data: sembunyikan grafik, tampilkan empty-state, kosongkan legend =====
  if(!teamsData.length){
    if(emptyEl){
      const teamLabel = CHART_TEAM_FILTER ? teamName(CHART_TEAM_FILTER) : null;
      emptyEl.style.display = 'flex';
      emptyEl.innerHTML = `
        ${ICONS.empty}
        <div class="es-title">Belum ada data FRA${teamLabel ? ' untuk ' + escapeHtml(teamLabel) : ''}</div>
        <div class="text-xs">Belum ada capaian FRA tercatat untuk tahun ${FILTER_YEAR}${teamLabel ? ' pada tim ini' : ' pada tim manapun'}.</div>
      `;
    }
    if(legend) legend.innerHTML = '';
    return;
  }
  if(emptyEl) emptyEl.style.display = 'none';

  const palette = ['#163B5C','#B4872A','#2E7D57','#C9820B','#B23A34','#0E2A44'];
  const padding = { top: 34, right: 44, bottom: 34, left: 48 };
  const chartW = width - padding.left - padding.right;
  const chartH = height - padding.top - padding.bottom;
  const maxY = 100;
  const baselineY = padding.top + chartH;

  ctx.strokeStyle = '#E8EDF1';
  ctx.lineWidth = 1;
  for(let y=0;y<=5;y++){
    const yy = padding.top + chartH - (chartH/5)*y;
    ctx.beginPath(); ctx.moveTo(padding.left, yy); ctx.lineTo(width-padding.right, yy); ctx.stroke();
  }

  ctx.strokeStyle = '#A1AEBF';
  ctx.fillStyle = '#65748b';
  ctx.lineWidth = 1.5;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.font = '12px Inter, sans-serif';
  for(let y=0;y<=5;y++){
    const value = y*20;
    const yy = padding.top + chartH - (chartH/5)*y;
    ctx.fillText(value+'%', padding.left-10, yy);
  }

  ctx.textAlign='center'; ctx.textBaseline='top';
  labels.forEach((label,i)=>{
    const x = padding.left + (chartW/(quarters.length-1))*i;
    ctx.fillText(label, x, padding.top+chartH+10);
  });

  // Kurva mulus (Catmull-Rom -> Bezier) melalui titik-titik yang valid
  function smoothPath(ctx, pts){
    if(pts.length < 2){
      if(pts.length === 1){ ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[0].x, pts[0].y); }
      return;
    }
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=0;i<pts.length-1;i++){
      const p0 = pts[i-1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i+1];
      const p3 = pts[i+2] || p2;
      const cp1x = p1.x + (p2.x - p0.x)/6;
      const cp1y = p1.y + (p2.y - p0.y)/6;
      const cp2x = p2.x - (p3.x - p1.x)/6;
      const cp2y = p2.y - (p3.y - p1.y)/6;
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
    }
  }

  teamsData.forEach((team, index)=>{
    const color = palette[index % palette.length];

    // kelompokkan titik valid jadi run berurutan (skip triwulan yang belum ada data)
    const runs = [];
    let currentRun = [];
    team.points.forEach((value,i)=>{
      if(value===null){
        if(currentRun.length) runs.push(currentRun);
        currentRun = [];
        return;
      }
      const x = padding.left + (chartW/(quarters.length-1))*i;
      const y = padding.top + chartH - (value/maxY)*chartH;
      currentRun.push({x,y,v:value});
    });
    if(currentRun.length) runs.push(currentRun);

    runs.forEach(pts=>{
      // area gradient di bawah kurva
      const gradient = ctx.createLinearGradient(0, padding.top, 0, baselineY);
      gradient.addColorStop(0, color + '55');
      gradient.addColorStop(1, color + '02');
      ctx.beginPath();
      smoothPath(ctx, pts);
      ctx.lineTo(pts[pts.length-1].x, baselineY);
      ctx.lineTo(pts[0].x, baselineY);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      // garis kurva mulus
      ctx.beginPath();
      smoothPath(ctx, pts);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();

      // titik data + label persentase
      pts.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = color;
        ctx.stroke();

        // label persentase: default di atas titik, tapi kalau titik terlalu
        // dekat ke tepi atas chart (nilai tinggi), pindah ke bawah titik
        // supaya teksnya tidak terpotong.
        const isNearTop = (p.y - padding.top) < 20;
        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = color;
        if(isNearTop){
          ctx.textBaseline = 'top';
          ctx.fillText(p.v + '%', p.x, p.y + 8);
        } else {
          ctx.textBaseline = 'bottom';
          ctx.fillText(p.v + '%', p.x, p.y - 8);
        }
      });
    });
  });

  if(legend) legend.innerHTML = teamsData.map((team,index)=>{
    const color = palette[index % palette.length];
    return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);">
      <span style="width:12px;height:12px;border-radius:50%;background:${color};display:inline-block;"></span>${escapeHtml(team.name)}
    </div>`;
  }).join('');
}
function statusFor(pct){
  if(pct===null) return {cls:'',tag:'tag-muted',label:'—'};
  if(pct>=100) return {cls:'success',tag:'tag-success',label:'Tercapai'};
  if(pct>=60) return {cls:'',tag:'tag-primary',label:'Sesuai Rencana'};
  if(pct>=30) return {cls:'warning',tag:'tag-warning',label:'Perlu Perhatian'};
  return {cls:'danger',tag:'tag-danger',label:'Tertinggal'};
}
function fraStatusFor(pct){
  if(pct>=100) return {cls:'success',tag:'tag-success',label:'Tercapai'};
  if(pct>=60)  return {cls:'',tag:'tag-primary',label:'Perlu Perhatian'};
  return {cls:'danger',tag:'tag-danger',label:'Tertinggal'};
}

function tugasPct(t){
  const target = Number(t.target)||0;

  if(!target) return 0;
  return Math.min(999, Math.round(realisasi/target*100));
}
function currentQuarterIndex(){
  const m = new Date().getMonth();
  return Math.floor(m/3); // 0..3
}
function fmtNum(n){ n=Number(n)||0; return n.toLocaleString('id-ID'); }
function currentQuarterKey(){
  return ['q1','q2','q3','q4'][currentQuarterIndex()];
}

function modalShell(title, bodyHtml, footHtml){
  return `<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-head"><h3>${title}</h3><button class="close-x" onclick="closeModal()">${ICONS.x}</button></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-foot">${footHtml}</div>
    </div>
  </div>`;
}
function openModal(html){
  const old = document.getElementById('modalOverlay');
  if(old) old.remove();
  document.body.insertAdjacentHTML('beforeend', html);
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click', e=>{
    if(e.target.id==='modalOverlay') closeModal();
  });
}
function closeModal(){
  const old = document.getElementById('modalOverlay');
  if(old) old.remove();
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    const viewerOverlay = document.getElementById('fileViewerOverlay');
    if(viewerOverlay) closeFileViewerModal();
  }
  // Navigasi antar berkas bukti dukung pakai tombol panah kiri/kanan,
  // hanya aktif kalau modal file viewer sedang terbuka dan ada >1 berkas.
  if((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && CURRENT_EVIDENCE_VIEW){
    const viewerOverlay = document.getElementById('fileViewerOverlay');
    if(viewerOverlay){
      const { groupId, index, total } = CURRENT_EVIDENCE_VIEW;
      if(e.key === 'ArrowLeft' && index > 0){
        e.preventDefault();
        viewEvidenceGroup(groupId, index - 1);
      } else if(e.key === 'ArrowRight' && index < total - 1){
        e.preventDefault();
        viewEvidenceGroup(groupId, index + 1);
      }
      return;
    }
  }
  if(e.key !== 'Enter') return;
  const overlay = document.getElementById('modalOverlay');
  if(!overlay) return; // tidak ada modal terbuka, biarkan perilaku normal
  const isTextarea = e.target.tagName === 'TEXTAREA';
  if(isTextarea && !(e.ctrlKey || e.metaKey)) return; // di textarea, Enter biasa = baris baru
  e.preventDefault();
  const btn = overlay.querySelector('.btn-primary');
  if(btn && !btn.disabled) btn.click();
});

let AUTO_ATTACH_TARGET = {}; // {kind: {collection, id}}
let EVIDENCE_UPLOAD_TOKEN = {};

function wireEvidenceField(kind, id){
  PENDING_EVIDENCE[kind] = [];
  EVIDENCE_UPLOADING[kind] = 0;
  EVIDENCE_UPLOAD_TOKEN[kind] = 0;
  const input = document.getElementById(`fileInput_${kind}`);
  if(!input) return;
  input.addEventListener('change', async ()=>{
    const files = Array.from(input.files || []);
    if(!files.length) return;
    const validFiles = files.filter(f=>validateFileOrToast(f));
    input.value = ''; // reset supaya bisa pilih file yang sama lagi kalau perlu

    let extra = {};
    if(kind === 'fra'){
      const periodeEl = document.getElementById('f_periode');
      const ikuEl = document.getElementById('f_ikuNomor');
      const tahunEl = document.getElementById('f_tahun');
      if(periodeEl) extra.periode = periodeEl.value;
      if(ikuEl) extra.ikuNomor = ikuEl.value;
      if(tahunEl) extra.tahun = tahunEl.value;
    }
    if(kind === 'tugas'){
      const triwulanEl = document.getElementById('f_triwulan');
      if(triwulanEl) extra.triwulan = triwulanEl.value;
    }
    if(kind === 'kegiatan'){
      const periodeEl = document.getElementById('pc_periode');
      const ikuEl = document.getElementById('pc_ikuNomor');
      const tahunEl = document.getElementById('pc_tahun');
      if(periodeEl) extra.periode = periodeEl.value;
      if(ikuEl) extra.ikuNomor = ikuEl.value;
      if(tahunEl) extra.tahun = tahunEl.value;
    }

    const myToken = EVIDENCE_UPLOAD_TOKEN[kind]; // dipakai bersama untuk seluruh batch ini
    const dz = document.getElementById(`dzContent_${kind}`);

    for(const file of validFiles){
      EVIDENCE_UPLOADING[kind]++;
      if(dz) dz.innerHTML = `<div class="dz-title">Mengunggah ${EVIDENCE_UPLOADING[kind]} berkas…</div><div class="dz-sub">${escapeHtml(file.name)}</div>`;
      try{
        const meta = await uploadFileToServer(file, kind, extra);
        if(myToken !== EVIDENCE_UPLOAD_TOKEN[kind]){
          apiDeleteFile(meta.filename); // batch ini sudah dibatalkan (modal ditutup/direset)
          continue;
        }
        PENDING_EVIDENCE[kind].push(meta);
        renderPendingChips(kind);

        const target = AUTO_ATTACH_TARGET[kind];
        if(target){
          try{
            const record = (DB[target.collection] || []).find(x=>x.id===target.id);
            const base = record ? {...record} : {};
            delete base.id;
            const combined = [...(base.evidenceFiles||[]), meta].map(f=>({fileName:f.fileName||f.filename, originalName:f.originalName, size:f.size}));
            await apiPut(target.collection, target.id, { ...base, hasEvidence:true, evidenceFiles: combined });
            await loadAll();
            renderContent();
            toast('Berkas bukti berhasil dikaitkan ke data yang sudah disimpan','ok');
          }catch(e){
            toast('Berkas terunggah, tapi gagal mengaitkan otomatis: ' + (e.message||''), 'err');
          }
        }
      }catch(e){
        toast(`Gagal mengunggah ${file.name}: ` + (e.message||''), 'err');
      }finally{
        EVIDENCE_UPLOADING[kind]--;
      }
    }
    if(dz) dz.innerHTML = `<div class="dz-title">Klik untuk unggah berkas</div><div class="dz-sub">Bisa pilih beberapa berkas sekaligus — PDF atau Word</div>`;
  });
}
function persistPendingEvidence(kind){
  const existing = (EXISTING_EVIDENCE[kind]||[]).map(f=>({fileName:f.fileName, originalName:f.originalName, size:f.size}));
  const pending = (PENDING_EVIDENCE[kind]||[]).map(f=>({fileName:f.filename, originalName:f.originalName, size:f.size}));
  const combined = [...existing, ...pending];
  return { hasEvidence: combined.length>0, evidenceFiles: combined };
}
// Panggil setelah record berhasil disimpan (create/update). Kalau upload untuk
// kind ini masih berjalan, daftarkan record ini supaya di-auto-attach nanti,
// dan beri tahu user lewat toast bahwa itu akan menyusul otomatis.
function registerAutoAttachIfUploading(kind, collection, id){
  if(EVIDENCE_UPLOADING[kind] > 0){
    AUTO_ATTACH_TARGET[kind] = { collection, id };
    toast('Data disimpan. Berkas masih diunggah dan akan dikaitkan otomatis begitu selesai.', 'ok');
    return true;
  }
  return false;
}

  #tanya-ai-fab{position:fixed;bottom:90px;right:24px;background:var(--primary-dark);color:#fff;border:none;border-radius:999px;padding:12px 18px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:9998;}
  #tanya-ai-fab:hover{background:var(--primary);}
  #tanya-ai-panel{position:fixed;bottom:150px;right:24px;width:360px;max-width:92vw;height:480px;max-height:72vh;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);display:none;flex-direction:column;overflow:hidden;z-index:9999;}
  #tanya-ai-panel.open{display:flex;}
  #tanya-ai-header{background:var(--primary-dark);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;}
  #tanya-ai-header h3{margin:0;font-size:14.5px;}
  #tanya-ai-header p{margin:2px 0 0;font-size:11.5px;color:#B9CADA;}
  #tanya-ai-close{background:none;border:none;color:#B9CADA;font-size:18px;cursor:pointer;line-height:1;}
  #tanya-ai-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--surface-2);}
  .tanya-ai-msg{max-width:85%;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.4;white-space:pre-wrap;}
  .tanya-ai-msg.user{align-self:flex-end;background:var(--primary);color:#fff;}
  .tanya-ai-msg.ai{align-self:flex-start;background:#fff;color:var(--ink);border:1px solid var(--line);}
  .tanya-ai-msg.error{align-self:flex-start;background:var(--danger-soft);color:var(--danger);border:1px solid #E3AFAA;}
  .tanya-ai-msg.loading{align-self:flex-start;background:#fff;color:var(--ink-muted);border:1px solid var(--line);font-style:italic;}
  #tanya-ai-inputbar{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line);background:#fff;}
  #tanya-ai-input{flex:1;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;font-size:13px;outline:none;font-family:'Inter',sans-serif;}
  #tanya-ai-input:focus{border-color:var(--primary);}
  #tanya-ai-send{background:var(--primary-dark);color:#fff;border:none;border-radius:8px;padding:0 15px;font-size:13px;font-weight:600;cursor:pointer;}
  #tanya-ai-send:disabled{opacity:.6;cursor:not-allowed;}
</style>

<script>
  function renderTanyaAIWidget(){
  if(document.getElementById('tanya-ai-fab')) return;
  const html = `
    <button id="tanya-ai-fab" onclick="toggleTanyaAI()">💬 Tanya AI</button>
    <div id="tanya-ai-panel">
      <div id="tanya-ai-header">
        <div>
          <h3>Tanya AI SIMONEV</h3>
          <p>Bertanya soal data kinerja tim</p>
        </div>
        <button id="tanya-ai-close" onclick="toggleTanyaAI()">✕</button>
      </div>
      <div id="tanya-ai-messages"></div>
      <div id="tanya-ai-inputbar">
        <input id="tanya-ai-input" type="text" placeholder="Tanya soal data SIMONEV..." onkeydown="if(event.key==='Enter') kirimTanyaAI()">
        <button id="tanya-ai-send" onclick="kirimTanyaAI()">Kirim</button>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
}
  function toggleTanyaAI(){
    document.getElementById('tanya-ai-panel').classList.toggle('open');
  }
  function tambahPesanTanyaAI(teks, tipe){
    const box = document.getElementById('tanya-ai-messages');
    const el = document.createElement('div');
    el.className = 'tanya-ai-msg ' + tipe;
    el.textContent = teks;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
    return el;
  }
  async function kirimTanyaAI(){
    const input = document.getElementById('tanya-ai-input');
    const sendBtn = document.getElementById('tanya-ai-send');
    const pertanyaan = input.value.trim();
    if(!pertanyaan) return;
    tambahPesanTanyaAI(pertanyaan, 'user');
    input.value = '';
    sendBtn.disabled = true;
    const loadingEl = tambahPesanTanyaAI('Mengetik...', 'loading');
    try{
      const res = await fetch('/api/tanya-ai', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        credentials: 'include',
        body: JSON.stringify({ pertanyaan }),
      });
      const data = await res.json();
      loadingEl.remove();
      if(!res.ok){
        tambahPesanTanyaAI(data.error || 'Terjadi kesalahan pada server', 'error');
      } else {
        tambahPesanTanyaAI(data.jawaban, 'ai');
      }
    }catch(err){
      loadingEl.remove();
      tambahPesanTanyaAI('Gagal terhubung ke server: ' + err.message, 'error');
    }finally{
      sendBtn.disabled = false;
    }
  }
</script>
</body>
</html>
